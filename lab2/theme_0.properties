# ==============================================================================
# FIȘIER DE CONFIGURARE A STILURILOR VIZUALE PENTRU REDACTORUL TEXT (LAB 2)
# ФАЙЛ НАСТРОЙКИ СТИЛЕЙ И ТЕМЫ ДЛЯ ТЕКСТОВОГО РЕДАКТОРА (ЛАБОРАТОРНАЯ 2)
#
# Вы можете менять любые параметры (цвета в формате HEX, шрифты, размеры).
# После изменения файла выберите в меню: „Vizualizare -> Reîncarcă tema din fișier”
# sau просто перезапустите программу!
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ОБЛАСТЬ РЕДАКТИРОВАНИЯ ТЕКСТА (ZONA DE REDACTARE A TEXTULUI)
# ------------------------------------------------------------------------------
# Цвет фона редактора (белый или темный)
editor.background=#FFFFFF

# Цвет основного текста
editor.foreground=#2C3E50

# Цвет курсора (каретки)
editor.caret.color=#2980B9

# Цвет подсветки выделенного текста
editor.selection.background=#B4D7FF

# Шрифт по умолчанию для нового текста (Arial, Times New Roman, Courier New, Segoe UI, etc.)
editor.default.font.family=Arial

# Размер шрифта по умолчанию (в пунктах)
editor.default.font.size=14


# ------------------------------------------------------------------------------
# 2. ПАНЕЛЬ ИНСТРУМЕНТОВ И МЕНЮ (TOOLBAR ȘI BARA DE MENIU)
# ------------------------------------------------------------------------------
# Цвет фона верхней панели инструментов
toolbar.background=#ECEFF1

# Цвет фона кнопок на панели инструментов
button.background=#FFFFFF

# Цвет текста на кнопках
button.foreground=#2C3E50

# Цвет рамки кнопок
button.border.color=#CFD8DC


# ------------------------------------------------------------------------------
# 3. ВКЛАДКИ ДОКУМЕНТОВ (TAB-URILE PENTRU FIȘIERE)
# ------------------------------------------------------------------------------
# Цвет фона панели вкладок
tab.background=#E2E8F0

# Цвет активной вкладки
tab.selected.background=#FFFFFF

# Цвет текста на вкладках
tab.foreground=#334155


# ------------------------------------------------------------------------------
# 4. СТРОКА СОСТОЯНИЯ (BARA DE STARE DE JOS)
# ------------------------------------------------------------------------------
# Цвет фона нижней строки состояния
statusbar.background=#ECEFF1

# Цвет текста строки состояния (строка, колонка, размер)
statusbar.foreground=#546E7A


# ------------------------------------------------------------------------------
# 5. ДИАЛОГ ПОИСКА И ЗАМЕНЫ (FEREASTRA CĂUTARE / ÎNLOCUIRE)
# ------------------------------------------------------------------------------
# Цвет фона диалогового окна поиска
dialog.background=#F8FAFC
